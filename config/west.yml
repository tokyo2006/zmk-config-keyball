manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: rirdical
      url-base: https://github.com/Rirdical
  projects:
    - name: zmk
      remote: cormoran
      revision: main+dya
      import: app/west.yml
      clone-depth: 1

    # DYA Studio feature modules
    - name: zmk-module-ble-management
      remote: cormoran
      revision: main
    - name: zmk-module-battery-history
      remote: cormoran
      revision: main
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: main
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: main
    - name: zmk-feature-custom-settings
      remote: cormoran
      revision: main
    - name: zmk-feature-runtime-macro
      remote: cormoran
      revision: main
    - name: zmk-feature-runtime-combo
      remote: cormoran
      revision: main

    # PMW3610 trackball driver with Custom Studio Protocol
    - name: zmk-driver-pmw3610-with-custom-studio-rpc
      remote: cormoran
      revision: main

    # nice!oled status screen (LVGL 9 / Zephyr 4.1 port)
    - name: zmk-nice-oled
      remote: rirdical
      revision: main
  self:
    path: config
